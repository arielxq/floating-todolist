[package]
name = "floating-todo"
version = "0.1.0"
description = "A quiet, local-first desktop todo list"
authors = ["Floating Todo"]
edition = "2021"

[lib]
name = "floating_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
